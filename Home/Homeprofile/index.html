<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>My Profile | Drin Electronics</title>

    <link rel="stylesheet" href="profile.css?v=3" />

</head>

<body>

    <div class="profile-page">

        <div class="profile-card">

            <a href="/" class="back-btn">
                ← Back to Home
            </a>

            <div class="profile-header">

                <div class="profile-avatar">
                    👤
                </div>

                <div>

                    <h1>My Profile</h1>

                    <p class="profile-subtitle">
                        Your checkout details are automatically synced and securely saved.
                    </p>
                    <div class="profile-badge">

                        <span>✔ Secure Profile</span>

                        <span>✔ Auto Synced</span>

                        <span>✔ Checkout Linked</span>

                    </div>
                </div>

            </div>


            <form id="profileForm">

                <button type="button" class="save-btn"
                    onclick="window.location.href='https://drinelectronicsph.com/checkout/checkout'">
                    Update Details in Checkout
                </button>

                <button type="button" class="save-btn"
                    onclick="window.location.href='https://drinelectronicsph.com/home-orders/'">
                    View My Orders
                </button>

            </form>

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

    <script src="../Admin/supabase.js?v=50000"></script>

    <script src="profile.js?v=3"></script>

</body>

</html>
