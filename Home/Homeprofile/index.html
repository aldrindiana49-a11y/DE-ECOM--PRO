<!DOCTYPE html>
<html lang="en">

<head>

    <link rel="icon" type="image/png" id="siteFavicon"
        href="https://zdinvxowzpkolbfzpcac.supabase.co/storage/v1/object/public/product-images/logo.png" />

    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>My Profile | Drin Electronics</title>

    <link rel="stylesheet" href="profile.css?v=4" />

</head>

<body>

    <div class="profile-page">

        <div class="profile-card">

            <a href="../index.html" class="back-btn">
                ← Back to Home
            </a>

            <div class="profile-header">

                <div class="profile-avatar">
                    👤
                </div>

                <div>

                    <h1>My Profile</h1>

                    <p class="profile-subtitle">
                        Your checkout details are automatically synced and securely saved.
                    </p>

                    <div class="profile-badge">

                        <span>✔ Secure Profile</span>

                        <span>✔ Auto Synced</span>

                        <span>✔ Checkout Linked</span>

                    </div>

                </div>

            </div>

            <form id="profileForm">

                <button type="button" class="save-btn" onclick="window.location.href='../checkout/checkout.html'">
                    Update Details in Checkout
                </button>

                <button type="button" class="save-btn" onclick="window.location.href='../home-orders/'">
                    View My Orders
                </button>

            </form>

            <section class="profile-wishlist-section">

                <div class="profile-wishlist-header">

                    <div>

                        <h2>My Wishlist</h2>

                        <p>
                            Products you saved for later.
                        </p>

                    </div>

                    <span id="wishlistCount" class="profile-wishlist-count">
                        0 items
                    </span>

                </div>

                <div id="profileWishlistLoading" class="profile-wishlist-loading">
                    Loading wishlist...
                </div>

                <div id="profileWishlistEmpty" class="profile-wishlist-empty" style="display:none;">

                    <div class="profile-wishlist-empty-icon">
                        ♡
                    </div>

                    <h3>Your wishlist is empty</h3>

                    <p>
                        Save products you like and they will appear here.
                    </p>

                    <button type="button" onclick="window.location.href='../index.html'">
                        Browse Products
                    </button>

                </div>

                <div id="profileWishlistGrid" class="profile-wishlist-grid"></div>

            </section>

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

    <script src="../Admin/supabase.js?v=50000"></script>

    <script src="profile.js?v=6"></script>

</body>

</html>
