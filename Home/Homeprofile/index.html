<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>My Profile | Drin Electronics</title>

    <link rel="stylesheet" href="profile.css?v=1" />

</head>

<body>

    <div class="profile-page">

        <div class="profile-card">

            <a href="/" class="back-btn">

                ← Back to Home

            </a>

            <h1>My Profile</h1>

            <p class="profile-subtitle">
                Manage your shipping and contact details.
            </p>

            <form id="profileForm">

                <div class="form-group">
                    <label>Full Name</label>

                    <input type="text" id="fullName" placeholder="Enter full name" />
                </div>

                <div class="form-group">
                    <label>Contact Number</label>

                    <input type="text" id="contactNumber" placeholder="09XXXXXXXXX" />
                </div>

                <div class="form-group">
                    <label>Province</label>

                    <input type="text" id="province" placeholder="Province" />
                </div>

                <div class="form-group">
                    <label>City / Municipality</label>

                    <input type="text" id="city" placeholder="City or Municipality" />
                </div>

                <div class="form-group">
                    <label>Barangay</label>

                    <input type="text" id="barangay" placeholder="Barangay" />
                </div>

                <div class="form-group">
                    <label>Street Address</label>

                    <textarea id="streetAddress" placeholder="House number, street, purok, etc."></textarea>
                </div>

                <div class="form-group">
                    <label>Postal Code</label>

                    <input type="text" id="postalCode" placeholder="Postal code" />
                </div>

                <button type="submit" class="save-btn">

                    Save Profile

                </button>

            </form>

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

  <script src="../Admin/supabase.js?v=50000"></script>

    <script src="profile.js?v=1"></script>

</body>

</html>
