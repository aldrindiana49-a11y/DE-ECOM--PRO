<!DOCTYPE html>
<html lang="en">

<head>

    <link rel="icon" type="image/png" id="siteFavicon"
        href="https://zdinvxowzpkolbfzpcac.supabase.co/storage/v1/object/public/product-images/logo.png" />

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>My Orders | Drin Electronics</title>

    <link rel="stylesheet" href="./orders.css?v=20260614001" />
</head>

<body>

    <div class="orders-page">

        <div class="orders-nav">

            <a href="/" class="back-btn">
                ← Back to Home
            </a>

        </div>

        <div class="orders-header">
            <h1>My Orders</h1>
            <p>Track your purchases, payment status, and shipping updates.</p>
        </div>

        <div id="ordersList" class="orders-list">
            <div class="loading">Loading your orders...</div>
        </div>

    </div>

    <div id="orderModal" class="order-modal">
        <div class="order-modal-card">

            <h3 id="orderModalTitle">Notice</h3>

            <div id="paymentLoader" class="payment-loader" style="display:none;"></div>

            <p id="orderModalMessage">
                Message here
            </p>

            <button type="button" onclick="closeOrderModal()" id="orderModalOk">
                OK
            </button>

        </div>
    </div>

    <div id="cancelRequestModal" class="cancel-request-modal">
        <div class="cancel-request-card">
            <h3>Request Cancellation</h3>

            <select id="cancelRequestReason">
                <option value="">Select reason</option>
                <option>Ordered by mistake</option>
                <option>Wrong address</option>
                <option>Found cheaper elsewhere</option>
                <option>Duplicate order</option>
                <option>Change payment method</option>
                <option>Other</option>
            </select>

            <div class="cancel-request-actions">
                <button onclick="submitCancelRequest()">Submit</button>
                <button onclick="closeCancelRequestModal()">Close</button>
            </div>
        </div>
    </div>

    <div id="reviewModal" class="order-modal">
        <div class="order-modal-card">
            <h3>Write Review</h3>

            <input type="hidden" id="reviewOrderId">

            <select id="reviewRating">
                <option value="5">★★★★★ 5</option>
                <option value="4">★★★★☆ 4</option>
                <option value="3">★★★☆☆ 3</option>
                <option value="2">★★☆☆☆ 2</option>
                <option value="1">★☆☆☆☆ 1</option>
            </select>

            <textarea id="reviewComment" placeholder="Write your comment..."
                style="width:100%;height:90px;margin-top:12px;"></textarea>

            <button onclick="submitReview()">Submit Review</button>
            <button onclick="closeReviewModal()">Cancel</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
    <script src="../Admin/supabase.js?v=20260614001"></script>
    <script src="./orders.js?v=20260614002"></script>
</body>

</html>
