<!DOCTYPE html>
<html lang="en">

<head>

  <link rel="icon" type="image/png" id="siteFavicon"
    href="https://zdinvxowzpkolbfzpcac.supabase.co/storage/v1/object/public/product-images/logo.png" />

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Support Inbox | Drin Electronics</title>

  <link rel="stylesheet" href="admin-chat.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
  <script src="../Admin/supabase.js"></script>
</head>

<body>

  <div class="chat-layout">

    <aside class="conversation-sidebar">

      <div class="sidebar-header">
        <h2>💬 Support Inbox</h2>
        <span id="unreadBadge">0</span>
      </div>

      <div id="conversationList" class="conversation-list"></div>

    </aside>

    <main class="chat-main">

      <div id="chatHeader" class="chat-header">
        Select a conversation
      </div>

      <div id="adminChatMessages" class="admin-chat-messages"></div>

      <div id="customerTypingText" class="admin-typing-text">
        Customer is typing...
      </div>

      <div class="admin-chat-input-row">

        <button type="button" class="admin-chat-tool-btn" onclick="toggleAdminEmojiPanel()">
          😊
        </button>

        <div id="adminEmojiPanel" class="admin-emoji-panel">

          <span onclick="addAdminEmoji('😊')">😊</span>

          <span onclick="addAdminEmoji('😍')">😍</span>

          <span onclick="addAdminEmoji('❤️')">❤️</span>

          <span onclick="addAdminEmoji('👍')">👍</span>

          <span onclick="addAdminEmoji('🙏')">🙏</span>

        </div>

        <input type="text" id="adminReplyInput" placeholder="Type reply..." autocomplete="off">

        <input type="file" id="adminChatFileInput" hidden accept="image/*,video/*">

        <button type="button" class="admin-chat-tool-btn"
          onclick="document.getElementById('adminChatFileInput').click()">
          📎
        </button>

        <button type="button" id="sendReplyBtn" class="admin-send-btn">
          Send
        </button>

      </div>

    </main>

  </div>

  <div id="chatImagePreview" class="chat-image-preview">
    <button class="chat-image-preview-close" onclick="closeChatImagePreview()">✕</button>
    <img id="chatPreviewImage" src="" alt="Preview">
  </div>

  <script src="admin-chat.js"></script>

</body>

</html>
