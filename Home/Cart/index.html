<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cart - Drin Electronics</title>
  <link rel="stylesheet" href="cart.css?v=50001" />
</head>

<body>
  <nav class="cart-navbar">
    <div class="cart-nav-left">
      <a href="#" class="back-link" onclick="smartBack('../index.html'); return false;">
        ← Back
      </a>
      <h1>Shopping Cart</h1>
    </div>
  </nav>

  <main class="cart-page">
    <section class="cart-main">
      <div class="section-head">
        <div>
          <h2>Your Items</h2>
          <p>Review your selected products</p>
        </div>

        <label class="select-all-box">
          <input type="checkbox" id="selectAll" onchange="toggleSelectAll(this)" />
          <span>Select All</span>
        </label>
      </div>

      <div id="cartList" class="cart-list"></div>
    </section>

    <aside class="cart-summary">
      <div class="summary-card">
        <h3>Order Summary</h3>

        <div class="summary-row">
          <span>Selected Items</span>
          <strong id="selectedCount">0</strong>
        </div>

        <div class="summary-row total-row">
          <span>Total</span>
          <strong id="cartTotal">₱0</strong>
        </div>

        <div class="cart-checkout-actions">

          <button type="button" class="shop-more-btn" onclick="shopMoreProducts()">
            Shop More
          </button>

          <button id="checkoutBtn" type="button" class="checkout-btn" onclick="goToCheckout()">
            Proceed to Checkout
          </button>

        </div>

        <div id="cartToast" class="cart-toast">
          <span id="cartToastText">Item removed</span>
          <button type="button" onclick="undoRemove()">Undo</button>
        </div>

      </div>
    </aside>
  </main>

  <script src="cart.js?v=50001"></script>
</body>

</html>
