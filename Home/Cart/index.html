    <img height="1" width="1" style="display:none"
      src="https://www.facebook.com/tr?id=4266303070285606&ev=PageView&noscript=1" />
  </noscript>

  <link rel="icon" type="image/png" id="siteFavicon"
    href="https://zdinvxowzpkolbfzpcac.supabase.co/storage/v1/object/public/product-images/logo.png" />

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cart - Drin Electronics</title>
  <link rel="stylesheet" href="cart.css?v=50001" />
</head>

<body>

  <div id="maintenancePopup" class="maintenance-popup">

    <div class="maintenance-box">

      <h2>
        ⚠️ Maintenance Ongoing
      </h2>

      <p>
        Checkout and shipping services
        may be temporarily unavailable.
      </p>

    </div>

  </div>

  <nav class="cart-navbar">
    <div class="cart-nav-left">
      <a href="#" class="back-link" onclick="smartBack('../index.html'); return false;">
        ← Back
      </a>
      <h1>Shopping Cart</h1>
    </div>
  </nav>

  <main class="cart-page">
    <section class="cart-main">
      <div class="section-head">
        <div>
          <h2>Your Items</h2>
          <p>Review your selected products</p>
        </div>

        <label class="select-all-box">
          <input type="checkbox" id="selectAll" onchange="toggleSelectAll(this)" />
          <span>Select All</span>
        </label>
      </div>

      <div id="cartList" class="cart-list"></div>
    </section>

    <aside class="cart-summary">
      <div class="summary-card">
        <h3>Order Summary</h3>

        <div class="summary-row">
          <span>Selected Items</span>
          <strong id="selectedCount">0</strong>
        </div>

        <div class="summary-row total-row">
          <span>Total</span>
          <strong id="cartTotal">₱0</strong>
        </div>

        <div class="cart-checkout-actions">

          <button type="button" class="shop-more-btn" onclick="shopMoreProducts()">
            Shop More
          </button>

          <button id="checkoutBtn" type="button" class="checkout-btn" onclick="goToCheckout()">
            Proceed to Checkout
          </button>

        </div>

        <div id="cartToast" class="cart-toast">
          <span id="cartToastText">Item removed</span>
          <button type="button" onclick="undoRemove()">Undo</button>
        </div>

      </div>
    </aside>
  </main>


  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

  <script src="../Admin/supabase.js?v=10002"></script>

  <script src="cart.js?v=90001"></script>
