<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cart - Drin Electronics</title>
  <link rel="stylesheet" href="cart.css" />
</head>

<body>
  <nav class="cart-navbar">
    <div class="cart-nav-left">
     <a href="../index.html" class="back-link">← Continue Shopping</a>
      <h1>Shopping Cart</h1>
    </div>
  </nav>

  <main class="cart-page">
    <section class="cart-main">
      <div class="section-head">
        <div>
          <h2>Your Items</h2>
          <p>Review your selected products</p>
        </div>

        <label class="select-all-box">
          <input type="checkbox" id="selectAll" onchange="toggleSelectAll(this)" />
          <span>Select All</span>
        </label>
      </div>

      <div id="cartList" class="cart-list"></div>
    </section>

    <aside class="cart-summary">
      <div class="summary-card">
        <h3>Order Summary</h3>

        <div class="summary-row">
          <span>Selected Items</span>
          <strong id="selectedCount">0</strong>
        </div>

        <div class="summary-row total-row">
          <span>Total</span>
          <strong id="cartTotal">₱0</strong>
        </div>

        <button id="checkoutBtn" type="button" class="checkout-btn" onclick="goToCheckout()">
          Proceed to Checkout
        </button>
      </div>
    </aside>
  </main>

  <script src="cart.js"></script>

  <div id="cartToast" class="cart-toast">
    <span id="cartToastText">Item removed</span>
    <button type="button" onclick="undoRemove()">Undo</button>
  </div>
</body>

</html>
