<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Login | Drin Electronics</title>

    <link rel="stylesheet" href="login.css?v=10001" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
</head>

<body>

    <div class="login-container">

        <div class="login-card">

            <a href="../" class="back-btn">← Back to Home</a>

            <h1>Welcome Back</h1>

            <p class="subtitle">Login to your Drin Electronics account.</p>

            <button id="googleLoginBtn" class="google-btn">
                <img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Google">
                Continue with Google
            </button>

            <p class="auth-trust-text">
                🔒 Secure login powered by Google authentication.
            </p>

            <div class="divider">
                <span>OR</span>
            </div>

            <form id="loginForm">

                <input type="email" id="email" placeholder="Email Address" required />

                <div class="password-group">
                    <input type="password" id="password" placeholder="Password" required />

                    <span class="toggle-password" onclick="togglePassword('password', this)">
                        <i class="fa-solid fa-eye-slash"></i>
                    </span>
                </div>

                <button type="submit" class="login-btn">
                    Login
                </button>

            </form>

            <div class="login-links">
                <a href="#" id="forgotPasswordBtn">
                    Forgot Password?
                </a>
                <a href="../signup/">Don’t have an account? Sign Up</a>
            </div>

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
    <script src="../Admin/supabase.js?v=50000"></script>
    <script src="login.js?v=10001"></script>


    <div id="premiumAlert" class="premium-alert">

        <div class="premium-alert-box">

            <div class="premium-alert-icon">
                🔐
            </div>

            <h3 id="premiumAlertTitle">
                Reset Password
            </h3>

            <p id="premiumAlertMessage">
                Message here
            </p>

            <div class="premium-alert-actions">

                <button id="premiumAlertCancel">
                    Cancel
                </button>

                <button id="premiumAlertConfirm">
                    Continue
                </button>

            </div>

        </div>

    </div>
</body>

</html>
