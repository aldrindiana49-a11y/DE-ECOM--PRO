<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Signup | Drin Electronics</title>

    <link rel="stylesheet" href="signup.css" />

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

</head>

<body>

    <div class="signup-container">

        <div class="banner-side">

            <div class="banner-overlay"></div>

            <div class="banner-content">

                <h1>
                    Drin Electronics
                </h1>

                <p>
                    Smart Electronics.<br>
                    Intelligent Ecommerce.<br>
                    Modern Technology Solutions.
                </p>

            </div>

        </div>

        <div class="signup-side">

            <a href="../" class="back-btn">
                ← Back to Home
            </a>

            <div class="signup-card">

                <h1>Create Account</h1>

                <p class="subtitle">
                    Join Drin Electronics today.
                </p>

                <button id="googleSignupBtn" class="google-btn">

                    <img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Google">

                    Continue with Google

                </button>

                <p class="auth-trust-text">
                    🔒 Secure signup powered by Google authentication.
                </p>

                <div class="divider">
                    <span>OR</span>
                </div>

                <form id="signupForm">

                    <input type="text" id="name" placeholder="Full Name" required />

                    <input type="tel" id="contactNumber" placeholder="Contact Number" pattern="[0-9]{11}" maxlength="11"
                        required />

                    <input type="email" id="email" placeholder="Email Address" required />

                    <div class="password-group">

                        <input type="password" id="password" placeholder="Password (Minimum 8 characters)" minlength="8"
                            required />

                        <span class="toggle-password" onclick="togglePassword('password', this)">
                            <i class="fa-solid fa-eye-slash"></i>
                        </span>

                    </div>

                    <div class="password-group">

                        <input type="password" id="confirmPassword" placeholder="Re-enter Password" minlength="8"
                            required />

                        <span class="toggle-password" onclick="togglePassword('confirmPassword', this)">
                            <i class="fa-solid fa-eye-slash"></i>
                        </span>

                    </div>

                    <button type="submit" class="signup-btn">
                        Create Account
                    </button>

                </form>

                <div class="signup-links">
                    <a href="../login/">
                        Already have an account? Login
                    </a>

                </div>

            </div>

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
    <script src="../Admin/supabase.js?v=10006"></script>
    <script src="signup.js?v=10006"></script>

</body>
