<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="icon" type="image/png" id="siteFavicon"
        href="https://zdinvxowzpkolbfzpcac.supabase.co/storage/v1/object/public/product-images/logo.png" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset Admin Password</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
    <script src="./supabase.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            background: #0f172a;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: Segoe UI, sans-serif;
            padding: 16px;
        }

        .box {
            background: white;
            width: 100%;
            max-width: 400px;
            padding: 32px;
            border-radius: 16px;
        }

        input,
        button {
            width: 100%;
            padding: 14px;
            margin-top: 12px;
            border-radius: 10px;
            font-size: 15px;
            border: 1px solid #d1d5db;
        }

        button {
            border: none;
            background: #06b6d4;
            color: white;
            font-weight: 700;
            cursor: pointer;
        }

        #message {
            margin-top: 14px;
            font-size: 14px;
            color: red;
        }

        .password-wrap {
            position: relative;
            margin-top: 12px;
        }

        .password-wrap input {
            width: 100%;
            padding-right: 45px;
            margin-top: 0;
        }

        .toggle-password {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            user-select: none;
        }
    </style>
</head>

<body>

    <div class="box">
        <h2>Reset Admin Password</h2>

        <div class="password-wrap">
            <input type="password" id="newPassword" placeholder="Enter new password" />

            <span id="toggleNewPassword" class="toggle-password">
                👁
            </span>
        </div>

        <div class="password-wrap">
            <input type="password" id="confirmPassword" placeholder="Confirm new password" />

            <span id="toggleConfirmPassword" class="toggle-password">
                👁
            </span>
        </div>

        <button id="resetBtn">
            Update Password
        </button>

        <div id="message"></div>
    </div>

    <script>
        const newPassword =
            document.getElementById("newPassword");

        const confirmPassword =
            document.getElementById("confirmPassword");

        const resetBtn =
            document.getElementById("resetBtn");

        const message =
            document.getElementById("message");

        const toggleNewPassword =
            document.getElementById("toggleNewPassword");

        const toggleConfirmPassword =
            document.getElementById("toggleConfirmPassword");

        toggleNewPassword.addEventListener("click", function () {

            if (newPassword.type === "password") {

                newPassword.type = "text";
                toggleNewPassword.textContent = "🙈";

            } else {

                newPassword.type = "password";
                toggleNewPassword.textContent = "👁";
            }

        });

        toggleConfirmPassword.addEventListener("click", function () {

            if (confirmPassword.type === "password") {

                confirmPassword.type = "text";
                toggleConfirmPassword.textContent = "🙈";

            } else {

                confirmPassword.type = "password";
                toggleConfirmPassword.textContent = "👁";
            }

        });

        resetBtn.addEventListener("click", async function () {

            const password =
                newPassword.value.trim();

            const confirm =
                confirmPassword.value.trim();

            if (password !== confirm) {

                message.style.color = "red";

                message.textContent =
                    "Passwords do not match.";

                return;
            }

            if (password.length < 8) {
                message.style.color = "red";
                message.textContent =
                    "Password must be at least 8 characters.";
                return;
            }

            const { error } =
                await supabaseClient.auth.updateUser({
                    password: password
                });

            if (error) {
                message.style.color = "red";
                message.textContent =
                    error.message;
                return;
            }

            message.style.color = "green";
            message.textContent =
                "Password updated successfully. Redirecting...";

            setTimeout(() => {
                window.location.href =
                    "./dashboard-index.html";
            }, 1500);

        });
    </script>

</body>

</html>
