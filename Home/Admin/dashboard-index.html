<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>D-E Admin Login</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Segoe UI, sans-serif;
    }

    body {
      background: #0f172a;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 16px;
    }

    .login-box {
      width: 100%;
      max-width: 400px;
      background: #fff;
      padding: 35px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, .2);
    }

    h1 {
      margin-bottom: 10px;
      color: #111827;
    }

    p {
      color: #6b7280;
      margin-bottom: 25px;
      font-size: 14px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: #111827;
    }

    input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      outline: none;
      font-size: 14px;
    }

    .password-wrap {
      position: relative;
    }

    .password-wrap input {
      padding-right: 45px;
    }

    .toggle-password {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      cursor: pointer;
      font-size: 18px;
      user-select: none;
    }

    button {
      width: 100%;
      border: none;
      background: #06b6d4;
      color: white;
      padding: 14px;
      border-radius: 10px;
      font-weight: 700;
      cursor: pointer;
      font-size: 15px;
    }

    button:hover {
      background: #0891b2;
    }

    .error {
      color: red;
      margin-top: 14px;
      font-size: 14px;
      display: none;
    }
  </style>
</head>

<body>

  <div class="login-box">

    <h1>D-E Admin</h1>
    <p>Secure admin access only.</p>

    <form id="loginForm">

      <div class="form-group">
        <label>Email</label>

        <input
          type="email"
          id="email"
          placeholder="example@email.com"
          required
        />
      </div>

      <div class="form-group">

        <label>Password</label>

        <div class="password-wrap">

          <input
            type="password"
            id="password"
            placeholder="Enter password"
            maxlength="32"
            required
          />

          <span
            id="togglePassword"
            class="toggle-password"
          >
            👁
          </span>

        </div>

      </div>

      <button type="submit">
        Login
      </button>

      <div class="error" id="errorMsg">
        Invalid admin credentials.
      </div>

    </form>

  </div>

  <script>

    const ADMIN_EMAIL =
      "admin@drinelectronicsph.com";

    const ADMIN_PASSWORD =
      "Drin@Admin2026";

    const loginForm =
      document.getElementById("loginForm");

    const emailInput =
      document.getElementById("email");

    const passwordInput =
      document.getElementById("password");

    const errorMsg =
      document.getElementById("errorMsg");

    const togglePassword =
      document.getElementById("togglePassword");

    togglePassword.addEventListener("click", function () {

      if (passwordInput.type === "password") {

        passwordInput.type = "text";
        togglePassword.textContent = "🙈";

      } else {

        passwordInput.type = "password";
        togglePassword.textContent = "👁";

      }

    });

    loginForm.addEventListener("submit", function (e) {

      e.preventDefault();

      const email =
        emailInput.value.trim().toLowerCase();

      const password =
        passwordInput.value.trim();

      if (
        email === ADMIN_EMAIL.toLowerCase() &&
        password === ADMIN_PASSWORD
      ) {

        localStorage.setItem(
          "drinAdminLoggedIn",
          "true"
        );

        window.location.href = "./index.html";

      } else {

        errorMsg.textContent =
          "Invalid admin credentials.";

        errorMsg.style.display =
          "block";

      }

    });

  </script>

</body>

</html>
